name: Beta artifact verification
on:
  workflow_dispatch:
permissions:
  # GitHub requires write permission to download unpublished draft assets.
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install verifier tooling
        run: |
          corepack enable npm
          corepack install
          npm ci
      - name: Verify release digests, checksum manifests, audits and signed payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          gh run watch 43026139653 --repo Ka1Thakkar/leaflogue --interval 30 --exit-status
          gh run watch 43026139005 --repo Ka1Thakkar/leaflogue --interval 30 --exit-status
          gh release download beta-candidate-43026139653-1 --repo Ka1Thakkar/leaflogue --dir /tmp/assets
          gh api 'repos/Ka1Thakkar/leaflogue/releases?per_page=100' --jq '.[] | select(.tag_name=="beta-candidate-43026139653-1")' > /tmp/assets/release-api.json
          node scripts/release-verification/assets.mjs /tmp/assets 0.1.1-beta.3 09a44fbc647f327edf0892a30503172538dc96a5
          npx esbuild apps/desktop/src/main/update-manifest.ts --bundle --platform=node --format=esm --outfile=/tmp/leaflogue-beta3-runtime-verifier.mjs
          node scripts/release-verification/signatures.mjs /tmp/assets
      - name: Scan extracted applications with checksum-verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks
          gh release download v8.24.3 --repo gitleaks/gitleaks --pattern gitleaks_8.24.3_linux_x64.tar.gz --pattern gitleaks_8.24.3_checksums.txt --dir /tmp/gitleaks
          (cd /tmp/gitleaks && sha256sum --check --ignore-missing gitleaks_8.24.3_checksums.txt && tar -xzf gitleaks_8.24.3_linux_x64.tar.gz)
          python3 scripts/release-verification/scan.py /tmp/assets
