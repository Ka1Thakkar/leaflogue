name: Windows MCP regression probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-mcp:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Probe update helper startup without building an installer
        shell: bash
        run: node scripts/probe-windows-update-startup.mjs
