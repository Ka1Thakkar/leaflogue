name: Refresh existing beta.6 build staging

on:
  workflow_dispatch:
    inputs:
      promote_only:
        type: boolean
        default: false
        description: Verify and replace existing beta.6 assets from completed build/signing runs
      build_run:
        type: string
        description: Successful staging run on this exact source commit
      signing_run:
        type: string
        description: Successful protected signing run on the existing beta tag

env:
  LEAFLOGUE_E2E_BACKGROUND: "1"

permissions:
  contents: read

concurrency:
  group: beta-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.promote_only != true
    name: Validate the exact beta source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable npm
          corepack install
          test "$(npm --version)" = "12.0.2"
          npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm audit --omit=dev --audit-level=high

  draft:
    if: inputs.promote_only != true
    name: Reuse existing unpublished staging release
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="beta-candidate-44087855277-1"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    if: inputs.promote_only != true
    name: Linux x64 and ARM64 plus backend
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-release-files
      - name: Build self-hostable web archive
        run: |
          npm run build --workspace @leaflogue/web
          mkdir -p release-files/web
          (cd apps/web/dist && zip -qr ../../../release-files/web/Leaflogue-0.1.1-beta.6-web.zip .)
          (cd release-files/web && sha256sum *.zip > SHA256SUMS-web.txt)
      - name: Retain validated Linux and backend downloads directly in the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-files -type f -print | sort)
          gh release upload "$CANDIDATE_TAG" "${assets[@]}" --clobber

  native:
    if: inputs.promote_only != true
    name: ${{ matrix.platform }} beta (${{ matrix.architecture }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: arm64
            runner: macos-15
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: windows
            architecture: x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native-beta
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
      - name: Retain only checksum-listed native files directly in the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          directory="apps/desktop/dist/beta-$NATIVE_PLATFORM-$NATIVE_ARCHITECTURE"
          sums="$directory/SHA256SUMS-$NATIVE_PLATFORM-$NATIVE_ARCHITECTURE.txt"
          assets=("$sums")
          while read -r checksum name; do
            test -n "$checksum"
            assets+=("$directory/$name")
          done < "$sums"
          gh release upload "$CANDIDATE_TAG" "${assets[@]}" --clobber

  complete:
    name: Verify every platform finished staging
    needs: [preflight, draft, linux, native]
    if: always() && inputs.promote_only != true
    runs-on: ubuntu-24.04
    steps:
      - name: Require all build and validation jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) { if (job.result !== "success") throw Error(`${name}: ${job.result}`); }'

  promote-existing:
    if: inputs.promote_only == true
    name: Verify and refresh the existing beta.6 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: node scripts/promote-beta6-refresh.mjs
        env:
          REFRESH_BUILD_RUN: ${{ inputs.build_run }}
          REFRESH_SIGNING_RUN: ${{ inputs.signing_run }}
          REFRESH_BUILD_SOURCE: ${{ github.sha }}
          REFRESH_PUBLISH: "1"
          GH_TOKEN: ${{ github.token }}
