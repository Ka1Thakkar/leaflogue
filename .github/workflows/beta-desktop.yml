name: Refresh existing beta.6 build staging

on:
  workflow_dispatch:
    inputs:
      windows_only:
        type: boolean
        default: false
        description: Rebuild Windows with the background renderer scheduling fix
      windows_source:
        type: string
        description: Exact source commit of the successful Windows repair run
      windows_run:
        type: string
        description: Successful Windows repair and signing run to verify during promotion
      promote_only:
        type: boolean
        default: false
        description: Promote the verified staged beta.6 files without rebuilding

env:
  LEAFLOGUE_E2E_BACKGROUND: "1"

permissions:
  contents: read

concurrency:
  group: beta-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.promote_only != true && inputs.windows_only != true
    name: Validate the exact beta source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable npm
          corepack install
          test "$(npm --version)" = "12.0.2"
          npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm audit --omit=dev --audit-level=high

  draft:
    if: inputs.promote_only != true && inputs.windows_only != true
    name: Create an unpublished beta candidate
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="beta-candidate-44087855277-1"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    if: inputs.promote_only != true && inputs.windows_only != true
    name: Linux x64 and ARM64 plus backend
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-release-files
      - name: Build self-hostable web archive
        run: |
          npm run build --workspace @leaflogue/web
          mkdir -p release-files/web
          (cd apps/web/dist && zip -qr ../../../release-files/web/Leaflogue-0.1.1-beta.6-web.zip .)
          (cd release-files/web && sha256sum *.zip > SHA256SUMS-web.txt)
      - name: Retain validated Linux and backend downloads directly in the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-files -type f -print | sort)
          gh release upload "$CANDIDATE_TAG" "${assets[@]}" --clobber

  native:
    if: inputs.promote_only != true && inputs.windows_only != true
    name: ${{ matrix.platform }} beta (${{ matrix.architecture }})
    needs: draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: arm64
            runner: macos-15
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: windows
            architecture: x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native-beta
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
      - name: Retain only checksum-listed native files directly in the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          directory="apps/desktop/dist/beta-$NATIVE_PLATFORM-$NATIVE_ARCHITECTURE"
          sums="$directory/SHA256SUMS-$NATIVE_PLATFORM-$NATIVE_ARCHITECTURE.txt"
          assets=("$sums")
          while read -r checksum name; do
            test -n "$checksum"
            assets+=("$directory/$name")
          done < "$sums"
          gh release upload "$CANDIDATE_TAG" "${assets[@]}" --clobber

  sign:
    name: Sign the beta update feeds
    if: success() && inputs.promote_only != true && inputs.windows_only != true
    needs: [draft, linux, native]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Sign exact validated artifacts with the separate beta key
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
          LEAFLOGUE_UPDATE_SIGNING_KEY: ${{ secrets.LEAFLOGUE_BETA_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir update-files
          gh release download "$CANDIDATE_TAG" --dir update-files \
            --pattern '*.AppImage' --pattern '*-mac-*.zip' --pattern '*-windows-*.exe'
          for architecture in x64 arm64; do
            node apps/desktop/scripts/update-manifest.mjs --channel beta --platform linux --architecture "$architecture" --directory update-files
            node apps/desktop/scripts/update-manifest.mjs --channel beta --platform mac --architecture "$architecture" --directory update-files
          done
          node apps/desktop/scripts/update-manifest.mjs --channel beta --platform windows --architecture x64 --directory update-files
          (cd update-files && sha256sum leaflogue-update-*.json leaflogue-update-*.json.sig > SHA256SUMS-updates.txt)
          gh release upload "$CANDIDATE_TAG" update-files/leaflogue-update-*.json update-files/leaflogue-update-*.json.sig update-files/SHA256SUMS-updates.txt --clobber

  complete:
    name: Mark the candidate ready for human validation
    needs: [draft, linux, native, sign]
    if: ${{ !cancelled() && needs.draft.result == 'success' && needs.linux.result == 'success' && needs.native.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF_NOTES
          Automated cross-platform candidate completed for $GITHUB_SHA.

          Linux x64/ARM64: AppImage and tar.gz. Mac Apple Silicon/Intel: DMG and ZIP. Windows x64: per-user installer and ZIP. Includes checksums, SBOMs, production audits, build inputs, and the Convex backend bundle.

          Mac packages are ad-hoc signed and NOT Apple-notarized. Windows packages are unsigned. These are beta validation files, not a signed stable update feed.

          The maintainer authorized experimental publication with manual clean-desktop and actual screen-reader acceptance still pending. Those checks are not passed. Tagged beta candidates include signed update feeds; branch candidates do not. Review the exact assets and notes before publication. This release stays DRAFT; the workflow never publishes it.

          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF_NOTES
          gh release edit "$CANDIDATE_TAG" --notes-file "$notes"

  promote-existing:
    if: inputs.promote_only == true
    name: Replace existing beta.6 downloads after independent verification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: node scripts/promote-beta6-refresh.mjs
        env:
          REFRESH_WINDOWS_RUN: ${{ inputs.windows_run }}
          REFRESH_EXPECTED_WINDOWS_SOURCE: ${{ inputs.windows_source }}
          GH_TOKEN: ${{ github.token }}

  windows-rebuild:
    if: inputs.windows_only == true
    name: Rebuild Windows with unthrottled background rendering
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/build-native-beta
        with:
          platform: windows
          architecture: x64
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          directory=apps/desktop/dist/beta-windows-x64
          sums="$directory/SHA256SUMS-windows-x64.txt"
          assets=("$sums")
          while read -r checksum name; do assets+=("$directory/$name"); done < "$sums"
          gh release upload beta-candidate-44087855277-1 "${assets[@]}" --clobber

  sign-windows-retry:
    name: Sign the beta update feeds
    if: inputs.windows_only == true
    needs: windows-rebuild
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Sign exact validated artifacts with the separate beta key
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: beta-candidate-44087855277-1
          LEAFLOGUE_UPDATE_SIGNING_KEY: ${{ secrets.LEAFLOGUE_BETA_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir update-files
          gh release download "$CANDIDATE_TAG" --dir update-files \
            --pattern '*.AppImage' --pattern '*-mac-*.zip' --pattern '*-windows-*.exe'
          for architecture in x64 arm64; do
            node apps/desktop/scripts/update-manifest.mjs --channel beta --platform linux --architecture "$architecture" --directory update-files
            node apps/desktop/scripts/update-manifest.mjs --channel beta --platform mac --architecture "$architecture" --directory update-files
          done
          node apps/desktop/scripts/update-manifest.mjs --channel beta --platform windows --architecture x64 --directory update-files
          (cd update-files && sha256sum leaflogue-update-*.json leaflogue-update-*.json.sig > SHA256SUMS-updates.txt)
          gh release upload "$CANDIDATE_TAG" update-files/leaflogue-update-*.json update-files/leaflogue-update-*.json.sig update-files/SHA256SUMS-updates.txt --clobber
